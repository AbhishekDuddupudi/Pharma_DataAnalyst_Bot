# ── Production compose (AWS EC2, Plan A) ──────────────────────────
# Differences from docker-compose.yml (local dev):
#   - No Postgres container — the database is AWS RDS (set via DATABASE_URL).
#   - No source-code volume mounts and no --reload.
#   - Frontend is built to static assets and served by Nginx.
#   - Only Nginx is published (port 80). The ALB terminates TLS and forwards
#     HTTP to this port. Backend (8000) is reachable only on the internal
#     compose network — never published to the host/internet.
#
# Requires a production .env on the host with at least:
#   APP_ENV=production
#   DATABASE_URL=postgresql+asyncpg://USER:PASS@<rds-endpoint>:5432/pharma_db
#   CORS_ORIGINS=https://your-domain
#   OPENAI_API_KEY=...
# (See .env.example.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # No ports: backend is internal-only, reached as http://backend:8000
    # by the web (nginx) service over the compose network.
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
