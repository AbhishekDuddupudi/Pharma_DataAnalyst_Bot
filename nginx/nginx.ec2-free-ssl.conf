# ── EC2-free variant — Phase 2: HTTPS (Let's Encrypt) ─────────────
# Port 80:  keeps the ACME challenge path (for renewals) and redirects all
#           other traffic to HTTPS.
# Port 443: serves the SPA + /api (SSE-safe) using the Let's Encrypt cert.
#
# Requires certs to already exist at:
#   /etc/letsencrypt/live/app.pharma-da-copilot.com/fullchain.pem
#   /etc/letsencrypt/live/app.pharma-da-copilot.com/privkey.pem
# Obtain them with the Phase-1 config first (see DEPLOYMENT.md), then re-up
# the web service with NGINX_CONF pointed at this file.

server {
    listen 80;
    server_name app.pharma-da-copilot.com;

    # Keep ACME reachable on :80 so `certbot renew` works.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.pharma-da-copilot.com;

    ssl_certificate     /etc/letsencrypt/live/app.pharma-da-copilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pharma-da-copilot.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # ── API reverse proxy (SSE-safe) ──────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # https on this server
        proxy_set_header X-Forwarded-Host  $host;

        # SSE / streaming: do NOT buffer.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
