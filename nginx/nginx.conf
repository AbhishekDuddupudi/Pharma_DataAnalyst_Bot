# ── Nginx server: single-origin SPA + API reverse proxy ───────────
# Serves the built React app at /  and proxies /api to the FastAPI backend.
# This is the public entrypoint for the EC2 host; in Plan A an AWS ALB
# terminates TLS and forwards plain HTTP to this server on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably sized JSON request bodies (chat messages, etc.).
    client_max_body_size 10m;

    # ── API reverse proxy ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Preserve original host + client info. X-Forwarded-Proto is expected
        # from the ALB and forwarded through so the backend sees the original
        # scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # ── SSE / streaming: do NOT buffer ────────────────────────
        # The chat stream endpoint relies on incremental flushing. The
        # backend also sends X-Accel-Buffering: no.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # Any non-file route returns index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
