# ── EC2-free variant — Phase 1: HTTP only (no TLS yet) ────────────
# Serves the SPA + /api over plain HTTP and exposes the ACME challenge path
# so Certbot can issue the first certificate. Use this for the initial HTTP
# smoke test (with APP_ENV=development) and to obtain the cert.
# After issuance, switch to nginx.ec2-free-ssl.conf (see DEPLOYMENT.md).

server {
    listen 80;
    server_name app.pharma-da-copilot.com;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # ACME HTTP-01 challenge, served from the shared certbot webroot volume.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── API reverse proxy (SSE-safe) ──────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE / streaming: do NOT buffer.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
