# ── EC2-only free-tier / credit-conscious compose (Plan B) ────────
# Single EC2 box runs the WHOLE stack with Docker Compose: Nginx (public),
# the built React app (static), the FastAPI backend, and a PostgreSQL
# container with a persistent named volume. NO RDS, NO ALB, NO ECS.
#
# Public surface: only Nginx on 80 + 443. Backend (8000) and Postgres (5432)
# are reachable only on the internal compose network — never published.
#
# HTTPS: Let's Encrypt via the bundled `certbot` service (webroot challenge).
# See DEPLOYMENT.md → "EC2-only free-tier deployment (Plan B)".
#
# This file does NOT replace docker-compose.prod.yml (ALB+RDS) or
# docker-compose.yml (local dev).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pharma_db}
    volumes:
      - pgdata_ec2:/var/lib/postgresql/data
      # Auto-applies db/*.sql in alphabetical order on FIRST boot (empty volume).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharma} -d ${POSTGRES_DB:-pharma_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports: internal-only.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point at the Postgres container (overrides any DATABASE_URL in .env).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pharma}:${POSTGRES_PASSWORD:-pharma_secret}@db:5432/${POSTGRES_DB:-pharma_db}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"   # internal-only; reached as http://backend:8000

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Phase 1 (HTTP, get cert): default nginx.ec2-free.conf.
      # Phase 2 (HTTPS): re-up with NGINX_CONF=./nginx/nginx.ec2-free-ssl.conf
      - ${NGINX_CONF:-./nginx/nginx.ec2-free.conf}:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot

  # Cert issuance + renewal helper. Not started by `up` (tools profile);
  # invoked explicitly with `docker compose run --rm certbot ...`.
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  pgdata_ec2:
  letsencrypt:
  certbot_www:
